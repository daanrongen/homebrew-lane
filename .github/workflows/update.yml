name: Update formula

# lane's publish workflow sends a `release` dispatch with the bundle's version, url and sha256.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: lane version, e.g. 0.1.9
        required: true
      url:
        description: Bundle url
        required: true
      sha256:
        description: Bundle sha256
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version || github.event.client_payload.version }}
      URL: ${{ inputs.url || github.event.client_payload.url }}
      SHA256: ${{ inputs.sha256 || github.event.client_payload.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the formula at the bundle
        run: |
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"$URL\"|" \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Formula/lane.rb
          git diff

      - name: Install and test
        run: |
          brew tap daanrongen/lane
          brew trust --tap daanrongen/lane || true
          cp Formula/lane.rb "$(brew --repository daanrongen/lane)/Formula/lane.rb"
          brew install daanrongen/lane/lane
          brew test daanrongen/lane/lane

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lane.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "lane v$VERSION"
          git push
